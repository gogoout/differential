name: Publish

# Manual release: bump [workspace.package].version in a PR, merge, then
# dispatch this from main. Publishes all workspace crates to crates.io in
# dependency order (native cargo workspace publishing, stable since 1.90).
# Requires the CARGO_REGISTRY_TOKEN repository secret.
on:
  workflow_dispatch:

jobs:
  publish:
    name: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish workspace to crates.io
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
