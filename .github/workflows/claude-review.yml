name: Claude Review

# Automatic code review on every PR (drafts are skipped: ready_for_review
# fires only on draft -> ready). Findings land as inline comments plus a
# "Claude Code Review" check run; the managed service dedups across pushes
# and resolves findings fixed by a later push. Review-only guidance lives
# in REVIEW.md at the repo root.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN repository secret (from `claude setup-token`)
# plus the Claude GitHub App installed on the repo.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    name: claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Pinned to v1.0.217. v1.0.218 installs Claude Code 2.1.265, whose
      # launcher is not created on the ubuntu24 20260907 runner image, so
      # every run fails before Claude starts (claude-code-action issue 1817).
      # Move the pin once upstream ships a fix.
      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Required for inline review comments even though the skill's own
          # frontmatter names the same tool.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
