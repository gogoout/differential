[workspace]
resolver = "3"
members = ["crates/schema", "crates/engine", "crates/llm", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
differential-schema = { path = "crates/schema" }
differential-engine = { path = "crates/engine" }
differential-llm = { path = "crates/llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
sha1 = "0.10"
hex = "0.4"
tempfile = "3"
toml = "0.8"
globset = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
