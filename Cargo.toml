[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gogoout/differential"

[workspace.dependencies]
# Version fields are required for publishing; bump them together with
# [workspace.package].version when cutting a release.
differential-engine = { path = "crates/engine", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
sha1 = "0.10"
hex = "0.4"
tempfile = "3"
toml = "0.8"
globset = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
